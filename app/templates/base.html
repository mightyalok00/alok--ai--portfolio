<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0f">
  <meta name="description" content="Alok Agarwal — SEO strategy, marketing analytics, Python, data science and AI/ML projects.">
  <meta property="og:title" content="Alok Agarwal — Search × Data × AI">
  <meta property="og:description" content="Connecting search, data, and AI to build measurable growth.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Alok Agarwal Portfolio">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="author" content="Alok Agarwal">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">
  <script type="application/ld+json">{{ {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": settings.owner_name,
    "url": settings.site_url,
    "jobTitle": "SEO, Data Analytics and AI/ML Project Builder",
    "address": {"@type": "PostalAddress", "addressLocality": "Jodhpur", "addressCountry": "IN"},
    "sameAs": [settings.github_url, settings.linkedin_url]
  } | tojson }}</script>
  <title>{% block title %}{{ settings.site_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="noise"></div><div class="scroll-progress" aria-hidden="true"></div>
  <header class="header">
    <a class="brand" href="#home"><span class="brand-icon">A<span>.</span></span><span>ALOK AGARWAL<small>SEO × DATA × AI</small></span></a>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="primary-navigation" aria-expanded="false">☰</button>
    <nav class="nav" id="primary-navigation" aria-label="Main navigation"><a href="#work">Work</a><a href="#case-studies">Case studies</a><a href="#expertise">Expertise</a><a href="#target-roles">Roles</a><a href="#faq">FAQs</a><a href="#contact" class="nav-contact">Let's connect <span>↗</span></a></nav>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="footer"><a class="brand" href="#home"><span class="brand-icon">A<span>.</span></span><span>ALOK AGARWAL<small>BUILT WITH CURIOSITY</small></span></a><span class="footer-note">Jodhpur, India · Open to meaningful opportunities</span><div class="footer-social"><a href="{{ settings.github_url }}" target="_blank" rel="noopener">GitHub ↗</a><a href="{{ settings.linkedin_url }}" target="_blank" rel="noopener">LinkedIn ↗</a><a href="/privacy">Privacy</a></div></footer>
  <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
</body></html>
